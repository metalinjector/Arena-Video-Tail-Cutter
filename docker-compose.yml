services:
  video-tail-remover:
    build:
      context: .
      dockerfile: Dockerfile
    image: arena-video-tail-remover:latest
    container_name: arena-video-tail-remover
    restart: unless-stopped
    ports:
      # host:container — change the left side to expose a different host port.
      - "8080:5000"
    environment:
      NODE_ENV: production
      PORT: "5000"
      PUBLIC_DIR: /app/public
      LOG_LEVEL: info
    # Optional: keep temporary upload/output files on fast, ephemeral storage.
    tmpfs:
      - /app/tmp-uploads
      - /app/tmp-outputs
